name: GUT Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gut:
    runs-on: ubuntu-latest
    env:
      HOME: /tmp/godot-home
      XDG_CONFIG_HOME: /tmp/godot-home/.config
      XDG_CACHE_HOME: /tmp/godot-home/.cache

    container:
      image: "barichello/godot-ci:4.7"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libfontconfig1 python3-numpy

      - name: Godot Headless Resource Import (Warmup)
        shell: bash
        run: |
          godot --headless --path "$PWD" --editor --quit || true

      - name: Run GUT Unit Tests
        shell: bash
        run: |
          godot --headless --path "$PWD" -s addons/gut/cli/gut_cli.gd -gconfig=.gutconfig.json -gexit
